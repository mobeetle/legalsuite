# nFPM config: one file builds .deb + .rpm from the same tree.
# Usage: nfpm package --config installer/nfpm.yaml --packager deb
#        nfpm package --config installer/nfpm.yaml --packager rpm
name: legalsuite
arch: amd64
platform: linux
version: 2.0.0
section: utils
priority: optional
maintainer: legalskills.cz
description: Legal skill suite (plaintext skills + Python/Node scripts + commands).
vendor: legalskills.cz
homepage: https://legalskills.cz
license: Apache-2.0
contents:
  - src: ./skills
    dst: /usr/share/legalsuite/skills
  - src: ./commands
    dst: /usr/share/legalsuite/commands
  - src: ./scripts
    dst: /usr/share/legalsuite/scripts
  - src: ./playbooks
    dst: /usr/share/legalsuite/playbooks
  - src: ./LICENSE
    dst: /usr/share/legalsuite/LICENSE
  - src: ./NOTICE
    dst: /usr/share/legalsuite/NOTICE
  - src: ./install.sh
    dst: /usr/share/legalsuite/install.sh
  - src: ./installer/legalsuite-install.sh
    dst: /usr/bin/legalsuite-install
    file_info: { mode: 0755 }
scripts:
  postinstall: ./installer/postinstall.sh
